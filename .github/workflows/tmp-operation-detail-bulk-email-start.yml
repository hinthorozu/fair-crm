name: One-shot operation detail bulk email start patch

on:
  push:
    branches:
      - fix/operation-detail-bulk-email-start-permission

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/operation-detail-bulk-email-start-permission
          fetch-depth: 0
      - name: Apply focused patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_bytes(path, old, new, expected=1):
              p = Path(path)
              data = p.read_bytes()
              eol = '\r\n' if b'\r\n' in data else '\n'
              old_b = old.replace('\n', eol).encode()
              new_b = new.replace('\n', eol).encode()
              count = data.count(old_b)
              if count != expected:
                  raise SystemExit(f'{path}: expected {expected} matches, found {count}')
              p.write_bytes(data.replace(old_b, new_b, expected))

          page = 'frontend/src/pages/OperationDetailPageLegacy.tsx'
          replace_bytes(
              page,
              '  const canExecute = can(OPERATION_EXECUTE);\n  const canRetryBulkEmail = can(FAIR_EMAIL_PERMISSION_EXECUTE);\n',
              '  const canExecute = can(OPERATION_EXECUTE);\n  const canStartBulkEmail = can(FAIR_EMAIL_PERMISSION_EXECUTE);\n  const canRetryBulkEmail = can(FAIR_EMAIL_PERMISSION_EXECUTE);\n',
          )
          replace_bytes(
              page,
              '  const isBulkEmailOp = detail?.operation.operation_type === "bulk_email";\n',
              '  const isBulkEmailOp = detail?.operation.operation_type === "bulk_email";\n  const canStartOperation = isBulkEmailOp ? canStartBulkEmail : canExecute;\n',
          )
          replace_bytes(
              page,
              '  const handleStart = async () => {\n    if (!canExecute) return;\n',
              '  const handleStart = async () => {\n    if (!canStartOperation) return;\n',
          )
          replace_bytes(
              page,
              '  const canStart =\n    canExecute &&\n',
              '  const canStart =\n    canStartOperation &&\n',
          )

          test = '''import { readFileSync } from "node:fs";\nimport { describe, expect, it } from "vitest";\n\nconst source = readFileSync(\n  new URL("../pages/OperationDetailPageLegacy.tsx", import.meta.url),\n  "utf8",\n);\n\ndescribe("OperationDetailPage execute permissions", () => {\n  it("uses fair email execute for Bulk Email Start while preserving generic Start fallback", () => {\n    expect(source).toContain(\n      'import { FAIR_EMAIL_PERMISSION_EXECUTE } from "../permissions/fairEmailPermissions";',\n    );\n    expect(source).toContain("const canStartBulkEmail = can(FAIR_EMAIL_PERMISSION_EXECUTE);");\n    expect(source).toContain("const canStartOperation = isBulkEmailOp ? canStartBulkEmail : canExecute;");\n    expect(source).toContain("const handleStart = async () => {\\n    if (!canStartOperation) return;");\n    expect(source).toContain("const canStart =\\n    canStartOperation &&");\n    expect(source).toContain("await startOperation(operationId);");\n  });\n\n  it("keeps operation execute at the Cancel mutation boundary", () => {\n    expect(source).toContain("const handleCancel = async () => {\\n    if (!canExecute) return;");\n    expect(source).toContain("await cancelOperation(operationId);");\n    expect(source).toContain("const canCancel =\\n    canExecute &&");\n  });\n\n  it("uses fair email execute at every bulk email retry boundary", () => {\n    expect(source).toContain("const canRetryBulkEmail = can(FAIR_EMAIL_PERMISSION_EXECUTE);");\n    expect(source).toContain("const handleRetryFailed = async () => {\\n    if (!canRetryBulkEmail) return;");\n    expect(source).toContain("const canRetryFailed =\\n    canRetryBulkEmail &&");\n    expect(source).toContain("retryConfirmOpen && canRetryBulkEmail");\n    expect(source).toContain("await retryBulkEmailOperationFailed(operationId);");\n  });\n});\n'''
          tp = Path('frontend/src/permissions/OperationDetailExecutePermissions.test.ts')
          test_eol = '\r\n' if b'\r\n' in tp.read_bytes() else '\n'
          tp.write_bytes(test.replace('\n', test_eol).encode())

          contract = '''{\n  "version": 1,\n  "id": "operation-detail-execute-permission-consistency",\n  "title": "Operation Detail Execute Permission Consistency",\n  "feature_type": "ui_only",\n  "owner": "fair-crm",\n  "platform_reusability": "existing_core_capability",\n  "trigger": "user",\n  "tenant_scope": "organization",\n  "user_facing": true,\n  "affected_paths": [\n    "frontend/src/pages/OperationDetailPageLegacy.tsx",\n    "frontend/src/permissions/OperationDetailExecutePermissions.test.ts",\n    ".kyrox/features/operation-detail-execute-permission-consistency.json"\n  ],\n  "permissions": {\n    "required": true,\n    "items": [\n      {\n        "code": "fair_crm.operations.execute",\n        "action": "start generic operations or cancel an operation from Operation Detail",\n        "scope": "organization",\n        "assignable": true\n      },\n      {\n        "code": "fair_crm.fair_emails.execute",\n        "action": "start or retry a Bulk Email operation from Operation Detail",\n        "scope": "organization",\n        "assignable": true\n      }\n    ]\n  },\n  "frontend": {\n    "required": true,\n    "routes": ["/operations"],\n    "menu": false,\n    "menu_permission": null\n  },\n  "applicability": {\n    "database": { "status": "na", "reason": "No persistence model changes are introduced." },\n    "migration": { "status": "na", "reason": "Existing execution permissions are reused." },\n    "permissions": { "status": "required" },\n    "backend": { "status": "na", "reason": "Existing operation Start authorization already selects the canonical business permission by operation type." },\n    "api": { "status": "na", "reason": "No server API contract changes." },\n    "tenant_isolation": { "status": "na", "reason": "No organization-scoping behavior changes." },\n    "audit": { "status": "na", "reason": "Existing operation execution audit behavior is unchanged." },\n    "frontend": { "status": "required" },\n    "ui_permissions": { "status": "required" },\n    "menu": { "status": "na", "reason": "No navigation changes are introduced." },\n    "route_guard": { "status": "na", "reason": "Operation detail read access and mutation permissions remain separate concerns." },\n    "forms": { "status": "required" },\n    "visual_qa": { "status": "required" },\n    "backend_tests": { "status": "na", "reason": "Backend authorization behavior is unchanged." },\n    "frontend_tests": { "status": "required" },\n    "runtime_authorization": { "status": "required" },\n    "runtime_verification": { "status": "required" },\n    "deployment": { "status": "required" }\n  },\n  "notes": "Operation Detail remains readable with its existing read access. Bulk Email Start and Retry Failed use fair_crm.fair_emails.execute, while generic Start and Cancel continue to use fair_crm.operations.execute. Enrichment and Scraper Detail Start alignment is intentionally outside this focused change. Bulk Email export remains read-only under the existing backend export permission."\n}\n'''
          Path('.kyrox/features/operation-detail-execute-permission-consistency.json').write_text(
              contract, encoding='utf-8', newline='\n'
          )
          PY
      - name: Commit focused patch and remove workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/pages/OperationDetailPageLegacy.tsx frontend/src/permissions/OperationDetailExecutePermissions.test.ts .kyrox/features/operation-detail-execute-permission-consistency.json
          git rm .github/workflows/tmp-operation-detail-bulk-email-start.yml
          git diff --cached --check
          git commit -m "fix(auth): align bulk email detail start permission"
          git push origin HEAD:fix/operation-detail-bulk-email-start-permission
