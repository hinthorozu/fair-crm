name: Temporary Scraper Wizard Prerequisite Patch

on:
  push:
    branches:
      - fix/scraper-wizard-prerequisite-permissions
    paths:
      - .github/workflows/tmp-scraper-wizard-prerequisites.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/scraper-wizard-prerequisite-permissions
          fetch-depth: 0
      - name: Apply narrow permission patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          def replace_bytes(path, old, new):
              p = Path(path)
              data = p.read_bytes()
              newline = b"\r\n" if b"\r\n" in data else b"\n"
              sep = "\r\n" if newline == b"\r\n" else "\n"
              old_b = old.replace("\n", sep).encode()
              new_b = new.replace("\n", sep).encode()
              count = data.count(old_b)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one match, got {count}")
              p.write_bytes(data.replace(old_b, new_b, 1))

          nav = "frontend/src/permissions/navigationPermissions.ts"
          replace_bytes(
              nav,
              '''  if (\n    pathname === "/operations/new/enrichment" ||\n    pathname === "/operations/new/scraper"\n  ) {\n    return hasGrantedCorePermission(granted, SCRAPER_PERMISSION_EXECUTE);\n  }\n''',
              '''  if (pathname === "/operations/new/enrichment") {\n    return hasGrantedCorePermission(granted, SCRAPER_PERMISSION_EXECUTE);\n  }\n  if (pathname === "/operations/new/scraper") {\n    return (\n      hasGrantedCorePermission(granted, SCRAPER_PERMISSION_EXECUTE) &&\n      hasGrantedCorePermission(granted, PERMISSION_FAIRS_READ) &&\n      hasGrantedCorePermission(granted, PERMISSION_SCRAPER_READ)\n    );\n  }\n''',
          )

          nav_test = "frontend/src/permissions/navigationPermissions.test.ts"
          replace_bytes(
              nav_test,
              '''  PERMISSION_EMAIL_ACCOUNTS_READ,\n  PERMISSION_IMPORTS_CREATE,\n''',
              '''  PERMISSION_EMAIL_ACCOUNTS_READ,\n  PERMISSION_FAIRS_READ,\n  PERMISSION_IMPORTS_CREATE,\n''',
          )
          replace_bytes(
              nav_test,
              '''    expect(\n      canAccessApplicationPath("/operations/new/scraper", granted(SCRAPER_PERMISSION_EXECUTE)),\n    ).toBe(true);\n''',
              '''    expect(\n      canAccessApplicationPath("/operations/new/scraper", granted(SCRAPER_PERMISSION_EXECUTE)),\n    ).toBe(false);\n    expect(\n      canAccessApplicationPath(\n        "/operations/new/scraper",\n        granted(SCRAPER_PERMISSION_EXECUTE, PERMISSION_FAIRS_READ),\n      ),\n    ).toBe(false);\n    expect(\n      canAccessApplicationPath(\n        "/operations/new/scraper",\n        granted(SCRAPER_PERMISSION_EXECUTE, PERMISSION_SCRAPER_READ),\n      ),\n    ).toBe(false);\n    expect(\n      canAccessApplicationPath(\n        "/operations/new/scraper",\n        granted(\n          SCRAPER_PERMISSION_EXECUTE,\n          PERMISSION_FAIRS_READ,\n          PERMISSION_SCRAPER_READ,\n        ),\n      ),\n    ).toBe(true);\n''',
          )

          operations = "frontend/src/pages/OperationsPage.tsx"
          replace_bytes(
              operations,
              '''import { PERMISSION_OPERATIONS_CREATE } from "../permissions/navigationPermissions";\n''',
              '''import {\n  PERMISSION_FAIRS_READ,\n  PERMISSION_OPERATIONS_CREATE,\n  PERMISSION_SCRAPER_READ,\n} from "../permissions/navigationPermissions";\n''',
          )
          replace_bytes(
              operations,
              '''  const canCreate = can(PERMISSION_OPERATIONS_CREATE);\n  const canExecute = can(OPERATION_EXECUTE);\n  const canStartBulkEmail = can(FAIR_EMAIL_PERMISSION_EXECUTE);\n  const canStartScraperActions = can(SCRAPER_PERMISSION_EXECUTE);\n  const canOpenNewOperation = canCreate || canStartBulkEmail || canStartScraperActions;\n''',
              '''  const canCreate = can(PERMISSION_OPERATIONS_CREATE);\n  const canExecute = can(OPERATION_EXECUTE);\n  const canReadFairs = can(PERMISSION_FAIRS_READ);\n  const canReadScraper = can(PERMISSION_SCRAPER_READ);\n  const canStartBulkEmail = can(FAIR_EMAIL_PERMISSION_EXECUTE);\n  const canStartScraperActions = can(SCRAPER_PERMISSION_EXECUTE);\n  const canCreateScraperOperation =\n    canStartScraperActions && canReadFairs && canReadScraper;\n  const canOpenNewOperation = canCreate || canStartBulkEmail || canStartScraperActions;\n''',
          )
          replace_bytes(
              operations,
              '''      if (type === "bulk_email") return canStartBulkEmail;\n      if (type === "enrichment" || type === "scraper") return canStartScraperActions;\n      return canCreate;\n    },\n    [canCreate, canStartBulkEmail, canStartScraperActions],\n''',
              '''      if (type === "bulk_email") return canStartBulkEmail;\n      if (type === "enrichment") return canStartScraperActions;\n      if (type === "scraper") return canCreateScraperOperation;\n      return canCreate;\n    },\n    [canCreate, canCreateScraperOperation, canStartBulkEmail, canStartScraperActions],\n''',
          )

          operations_test = "frontend/src/permissions/OperationsPagePermissions.test.ts"
          replace_bytes(
              operations_test,
              '''  it("allows scraper execute to open and select Enrichment and Scraper specialized entries", () => {\n    expect(source).toContain(\n      'if (type === "enrichment" || type === "scraper") return canStartScraperActions;',\n    );\n    expect(source).toContain("return canCreate;");\n  });\n''',
              '''  it("keeps Enrichment execute-only and requires Scraper wizard read prerequisites", () => {\n    expect(navigationPermissionSource).toContain(\n      'PERMISSION_FAIRS_READ = "fair_crm.fairs.read"',\n    );\n    expect(navigationPermissionSource).toContain(\n      'PERMISSION_SCRAPER_READ = "fair_crm.scraper.read"',\n    );\n    expect(source).toContain("const canReadFairs = can(PERMISSION_FAIRS_READ);");\n    expect(source).toContain("const canReadScraper = can(PERMISSION_SCRAPER_READ);");\n    expect(source).toContain("const canCreateScraperOperation =");\n    expect(source).toContain(\n      "canStartScraperActions && canReadFairs && canReadScraper;",\n    );\n    expect(source).toContain('if (type === "enrichment") return canStartScraperActions;');\n    expect(source).toContain('if (type === "scraper") return canCreateScraperOperation;');\n    expect(source).toContain("return canCreate;");\n  });\n''',
          )

          route_contract_path = Path(".kyrox/features/operation-wizard-route-permission-consistency.json")
          route_contract = json.loads(route_contract_path.read_text(encoding="utf-8"))
          route_items = route_contract["permissions"]["items"]
          for item in route_items:
              if item["code"] == "fair_crm.scraper.execute":
                  item["action"] = "enter the Enrichment immediate-start wizard and authorize Scraper start"
          existing_codes = {item["code"] for item in route_items}
          insert_at = next(i for i, item in enumerate(route_items) if item["code"] == "fair_crm.operations.execute")
          new_items = []
          if "fair_crm.fairs.read" not in existing_codes:
              new_items.append({
                  "code": "fair_crm.fairs.read",
                  "action": "discover and select the mandatory fair in the Scraper wizard",
                  "scope": "organization",
                  "assignable": True,
              })
          if "fair_crm.scraper.read" not in existing_codes:
              new_items.append({
                  "code": "fair_crm.scraper.read",
                  "action": "discover mandatory adapter and manifest metadata in the Scraper wizard",
                  "scope": "organization",
                  "assignable": True,
              })
          route_items[insert_at:insert_at] = new_items
          route_contract["applicability"]["backend"]["reason"] = (
              "Backend immediate-start authorization and existing fair/scraper read boundaries remain unchanged and authoritative."
          )
          route_contract["notes"] = (
              "Specialized operation wizard deep links must not reintroduce generic operation-create prerequisites. "
              "Bulk Email uses fair_emails.execute. Enrichment remains accessible with scraper.execute alone because its fair filter is optional. "
              "Scraper Start remains authorized by scraper.execute, but entering its wizard additionally requires fairs.read and scraper.read because the user must deliberately discover/select a fair and adapter/manifest before the action can be configured. "
              "Duplicate Check uses operations.execute plus its legitimate data_operations.read page prerequisite. The generic /operations/new route and unknown generic operation wizard fallback continue to require operations.create."
          )
          route_contract_path.write_text(json.dumps(route_contract, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")

          entry_contract_path = Path(".kyrox/features/operations-new-scraper-entry-permission-consistency.json")
          entry_contract = json.loads(entry_contract_path.read_text(encoding="utf-8"))
          entry_items = entry_contract["permissions"]["items"]
          for item in entry_items:
              if item["code"] == "fair_crm.scraper.execute":
                  item["action"] = "authorize the Scraper operation start action"
          existing_codes = {item["code"] for item in entry_items}
          if "fair_crm.fairs.read" not in existing_codes:
              entry_items.append({
                  "code": "fair_crm.fairs.read",
                  "action": "discover and select the mandatory fair for a new Scraper operation",
                  "scope": "organization",
                  "assignable": True,
              })
          if "fair_crm.scraper.read" not in existing_codes:
              entry_items.append({
                  "code": "fair_crm.scraper.read",
                  "action": "discover mandatory adapter and manifest metadata for a new Scraper operation",
                  "scope": "organization",
                  "assignable": True,
              })
          entry_contract["applicability"]["api"]["reason"] = (
              "No API contract changes; existing fair and scraper read clients/endpoints remain authoritative for mandatory wizard discovery."
          )
          entry_contract["applicability"]["route_guard"] = {"status": "required"}
          entry_contract["notes"] = (
              "The Scraper new-operation entry and its deep link are available only when scraper.execute, fairs.read, and scraper.read are all granted. "
              "The two read permissions are legitimate wizard prerequisites because the user must browse/select a fair and scraper adapter/manifest. "
              "The final Scraper Start action itself remains scraper.execute-only. Enrichment continues to use scraper.execute alone, Bulk Email continues to use fair_emails.execute, and generic operation entries continue to require operations.create."
          )
          entry_contract_path.write_text(json.dumps(entry_contract, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY

          git add frontend/src/permissions/navigationPermissions.ts \
                  frontend/src/permissions/navigationPermissions.test.ts \
                  frontend/src/pages/OperationsPage.tsx \
                  frontend/src/permissions/OperationsPagePermissions.test.ts \
                  .kyrox/features/operation-wizard-route-permission-consistency.json \
                  .kyrox/features/operations-new-scraper-entry-permission-consistency.json
          git config core.whitespace cr-at-eol
          git diff --cached --check
          git rm .github/workflows/tmp-scraper-wizard-prerequisites.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(auth): align scraper wizard prerequisites"
          git push origin HEAD:fix/scraper-wizard-prerequisite-permissions
