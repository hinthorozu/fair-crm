name: Prod-Path E2E

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "backend/**"
      - "scripts/**"
      - "docs/CI_PROD_PATH_E2E.md"
      - ".github/workflows/prod-path-e2e.yml"

jobs:
  prod-path-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      FAIR_CRM_DEV_BYPASS_CORE: "false"
      KYROX_CORE_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/kyrox_core
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/fair_crm
      KYROX_CORE_BASE_URL: http://127.0.0.1:8000
      FAIR_CRM_BASE_URL: http://127.0.0.1:8001
      APP_ENV: test

    steps:
      - name: Checkout fair-crm
        uses: actions/checkout@v4

      - name: Resolve kyrox-core dependency ref
        id: core-ref
        shell: bash
        run: |
          CORE_REF="main"
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            for CANDIDATE in "${{ github.head_ref }}" "${{ github.base_ref }}"; do
              if [[ -z "$CANDIDATE" ]]; then
                continue
              fi
              if git ls-remote --exit-code --heads \
                "https://github.com/${{ github.repository_owner }}/kyrox-core.git" \
                "refs/heads/$CANDIDATE" >/dev/null 2>&1; then
                CORE_REF="$CANDIDATE"
                break
              fi
            done
          fi
          echo "ref=$CORE_REF" >> "$GITHUB_OUTPUT"
          echo "Using kyrox-core ref: $CORE_REF"

      - name: Checkout kyrox-core
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/kyrox-core
          ref: ${{ steps.core-ref.outputs.ref }}
          path: kyrox-core
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate CI auth credentials
        run: |
          jwt_secret="$(python -c 'import secrets; print(secrets.token_urlsafe(48))')"
          dev_password="$(python -c 'import secrets; print(secrets.token_urlsafe(32))')"
          echo "::add-mask::$jwt_secret"
          echo "::add-mask::$dev_password"
          {
            echo "JWT_SECRET_KEY=$jwt_secret"
            echo "DEV_USER_PASSWORD=$dev_password"
          } >> "$GITHUB_ENV"

      - name: Install dependencies
        run: |
          pip install -r backend/requirements.txt
          pip install -r kyrox-core/requirements.txt
          pip install httpx psycopg2-binary argon2-cffi

      - name: Prepare databases
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -c "CREATE DATABASE kyrox_core;"
          PGPASSWORD=postgres psql -h localhost -U postgres -c "CREATE DATABASE fair_crm;"
          cd kyrox-core
          DATABASE_URL="$KYROX_CORE_DATABASE_URL" PYTHONPATH=backend python -m alembic -c alembic.ini upgrade head
          cd ..
          PYTHONPATH=backend python -m alembic -c alembic.ini upgrade head

      - name: Start KYROX Core
        working-directory: kyrox-core/backend
        run: |
          DATABASE_URL="$KYROX_CORE_DATABASE_URL" nohup python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/core.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8000/api/v1/health && break
            sleep 2
          done

      - name: Start Fair CRM
        working-directory: backend
        env:
          FAIR_CRM_DEV_BYPASS_CORE: "false"
        run: |
          nohup python -m uvicorn app.main:app --host 127.0.0.1 --port 8001 > /tmp/fair.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8001/health && break
            sleep 2
          done

      - name: Prod-path E2E gate
        env:
          KYROX_CORE_ROOT: ${{ github.workspace }}/kyrox-core
        run: python scripts/e2e_validation.py --ci

      - name: Todo worklist authorization regressions
        run: |
          python -m pytest backend/tests/modules/todos/test_worklist_permission_authorization.py -q
          python - <<'PY'
          import json
          import os
          import httpx

          state = json.loads(open("scripts/.dev_state.json", encoding="utf-8").read())
          email = state.get("email", "dev@example.com")
          org_id = state["organization_id"]
          password = os.environ["DEV_USER_PASSWORD"]
          core_base = os.environ["KYROX_CORE_BASE_URL"]

          login = httpx.post(
              f"{core_base}/api/v1/auth/login",
              json={"email": email, "password": password},
              timeout=10.0,
          )
          login.raise_for_status()
          token = login.json()["access_token"]
          headers = {
              "Authorization": f"Bearer {token}",
              "X-Organization-Id": org_id,
          }
          for permission_code in (
              "fair_crm.todos.update",
              "fair_crm.mail_send_operations.execute",
          ):
              response = httpx.post(
                  f"{core_base}/api/v1/organizations/{org_id}/authorization/check",
                  headers=headers,
                  json={"permission_code": permission_code},
                  timeout=10.0,
              )
              assert response.status_code == 200, (permission_code, response.text)
              assert response.json().get("allowed") is True, (permission_code, response.text)
          PY

      - name: Upload E2E report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-validation-report
          path: scripts/e2e_validation_report.json
