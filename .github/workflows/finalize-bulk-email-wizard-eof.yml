name: Finalize Bulk Email Wizard EOF

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  finalize:
    if: github.head_ref == 'fix/bulk-email-send-single-permission'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/bulk-email-send-single-permission
          fetch-depth: 0
      - name: Add final CRLF and remove helper
        shell: python
        run: |
          from pathlib import Path
          path = Path("frontend/src/pages/BulkEmailOperationWizardPage.tsx")
          data = path.read_bytes()
          if not data.endswith(b"\r\n"):
              path.write_bytes(data + b"\r\n")
          Path(".github/workflows/finalize-bulk-email-wizard-eof.yml").unlink()
      - name: Commit EOF normalization
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/pages/BulkEmailOperationWizardPage.tsx .github/workflows/finalize-bulk-email-wizard-eof.yml
          git commit -m "chore: preserve bulk email wizard final CRLF"
          git push origin HEAD:fix/bulk-email-send-single-permission
