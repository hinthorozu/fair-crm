name: Temporary Bulk Email Mail Settings Prerequisite Patch

on:
  push:
    branches:
      - fix/bulk-email-wizard-mail-settings-prerequisites
    paths:
      - .github/workflows/tmp-bulk-email-mail-settings-prerequisites.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply byte-preserving focused patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def load(path):
              p = Path(path)
              data = p.read_bytes()
              eol = b"\r\n" if b"\r\n" in data else b"\n"
              normalized = data.replace(b"\r\n", b"\n")
              had_final = normalized.endswith(b"\n")
              lines = normalized.decode("utf-8").split("\n")
              if had_final:
                  lines = lines[:-1]
              return p, lines, eol, had_final

          def save(p, lines, eol, had_final):
              data = "\n".join(lines).encode("utf-8").replace(b"\n", eol)
              if had_final:
                  data += eol
              p.write_bytes(data)

          def edit(path, fn):
              p, lines, eol, had_final = load(path)
              fn(lines)
              save(p, lines, eol, had_final)

          def one(lines, target):
              hits = [i for i, line in enumerate(lines) if line == target]
              if len(hits) != 1:
                  raise SystemExit(f"expected one line {target!r}, found {len(hits)}")
              return hits[0]

          def replace_line(lines, old, new):
              lines[one(lines, old)] = new

          def insert_after(lines, target, additions):
              i = one(lines, target)
              lines[i + 1:i + 1] = additions

          def replace_block(lines, old, new):
              width = len(old)
              hits = [i for i in range(len(lines) - width + 1) if lines[i:i + width] == old]
              if len(hits) != 1:
                  raise SystemExit(f"expected one block starting {old[0]!r}, found {len(hits)}")
              i = hits[0]
              lines[i:i + width] = new

          def nav(lines):
              replace_block(lines, [
                  '  if (pathname === "/operations/new/bulk-email") {',
                  '    return hasGrantedCorePermission(granted, FAIR_EMAIL_PERMISSION_EXECUTE);',
                  '  }',
              ], [
                  '  if (pathname === "/operations/new/bulk-email") {',
                  '    return (',
                  '      hasGrantedCorePermission(granted, FAIR_EMAIL_PERMISSION_EXECUTE) &&',
                  '      hasGrantedCorePermission(granted, PERMISSION_MAIL_TEMPLATES_READ) &&',
                  '      hasGrantedCorePermission(granted, PERMISSION_EMAIL_ACCOUNTS_READ)',
                  '    );',
                  '  }',
              ])
          edit("frontend/src/permissions/navigationPermissions.ts", nav)

          def nav_test(lines):
              insert_after(lines, '  PERMISSION_MAIL_SEND_OPERATIONS_READ,', ['  PERMISSION_MAIL_TEMPLATES_READ,'])
              replace_block(lines, [
                  '    expect(',
                  '      canAccessApplicationPath("/operations/new/bulk-email", granted(FAIR_EMAIL_PERMISSION_EXECUTE)),',
                  '    ).toBe(true);',
              ], [
                  '    expect(',
                  '      canAccessApplicationPath("/operations/new/bulk-email", granted(FAIR_EMAIL_PERMISSION_EXECUTE)),',
                  '    ).toBe(false);',
                  '    expect(',
                  '      canAccessApplicationPath(',
                  '        "/operations/new/bulk-email",',
                  '        granted(FAIR_EMAIL_PERMISSION_EXECUTE, PERMISSION_MAIL_TEMPLATES_READ),',
                  '      ),',
                  '    ).toBe(false);',
                  '    expect(',
                  '      canAccessApplicationPath(',
                  '        "/operations/new/bulk-email",',
                  '        granted(FAIR_EMAIL_PERMISSION_EXECUTE, PERMISSION_EMAIL_ACCOUNTS_READ),',
                  '      ),',
                  '    ).toBe(false);',
                  '    expect(',
                  '      canAccessApplicationPath(',
                  '        "/operations/new/bulk-email",',
                  '        granted(',
                  '          FAIR_EMAIL_PERMISSION_EXECUTE,',
                  '          PERMISSION_MAIL_TEMPLATES_READ,',
                  '          PERMISSION_EMAIL_ACCOUNTS_READ,',
                  '        ),',
                  '      ),',
                  '    ).toBe(true);',
              ])
          edit("frontend/src/permissions/navigationPermissions.test.ts", nav_test)

          def operations(lines):
              i = one(lines, '  PERMISSION_FAIRS_READ,')
              lines[i:i] = ['  PERMISSION_EMAIL_ACCOUNTS_READ,']
              i = one(lines, '  PERMISSION_OPERATIONS_CREATE,')
              lines[i:i] = ['  PERMISSION_MAIL_TEMPLATES_READ,']
              i = one(lines, '  const canReadFairs = can(PERMISSION_FAIRS_READ);')
              lines[i:i] = ['  const canReadEmailAccounts = can(PERMISSION_EMAIL_ACCOUNTS_READ);']
              i = one(lines, '  const canReadScraper = can(PERMISSION_SCRAPER_READ);')
              lines[i:i] = ['  const canReadMailTemplates = can(PERMISSION_MAIL_TEMPLATES_READ);']
              insert_after(lines, '  const canStartScraperActions = can(SCRAPER_PERMISSION_EXECUTE);', [
                  '  const canCreateBulkEmailOperation =',
                  '    canStartBulkEmail && canReadMailTemplates && canReadEmailAccounts;',
              ])
              replace_line(lines, '    canStartBulkEmail ||', '    canCreateBulkEmailOperation ||')
              replace_line(lines, '      if (type === "bulk_email") return canStartBulkEmail;', '      if (type === "bulk_email") return canCreateBulkEmailOperation;')
              replace_line(lines, '    [canCreate, canCreateEnrichmentOperation, canCreateScraperOperation, canStartBulkEmail],', '    [canCreate, canCreateBulkEmailOperation, canCreateEnrichmentOperation, canCreateScraperOperation],')
          edit("frontend/src/pages/OperationsPage.tsx", operations)

          def operations_test(lines):
              replace_line(lines, '  it("allows Bulk Email execute to open and select its new-operation entry", () => {', '  it("requires Bulk Email mail-setting reads for its new-operation entry", () => {')
              insert_after(lines, '    expect(source).toContain("const canCreate = can(PERMISSION_OPERATIONS_CREATE)");', [
                  '    expect(navigationPermissionSource).toContain(',
                  '      \'PERMISSION_EMAIL_ACCOUNTS_READ = "fair_crm.email_accounts.read"\',',
                  '    );',
                  '    expect(navigationPermissionSource).toContain(',
                  '      \'PERMISSION_MAIL_TEMPLATES_READ = "fair_crm.mail_templates.read"\',',
                  '    );',
                  '    expect(source).toContain("const canReadEmailAccounts = can(PERMISSION_EMAIL_ACCOUNTS_READ);");',
                  '    expect(source).toContain("const canReadMailTemplates = can(PERMISSION_MAIL_TEMPLATES_READ);");',
                  '    expect(source).toContain("const canCreateBulkEmailOperation =");',
                  '    expect(source).toContain(',
                  '      "canStartBulkEmail && canReadMailTemplates && canReadEmailAccounts;",',
                  '    );',
              ])
              insert_after(lines, '    expect(source).toContain("const canOpenNewOperation =");', ['    expect(source).toContain("canCreateBulkEmailOperation ||");'])
              replace_line(lines, '    expect(source).toContain(\'if (type === "bulk_email") return canStartBulkEmail;\');', '    expect(source).toContain(\'if (type === "bulk_email") return canCreateBulkEmailOperation;\');')
          edit("frontend/src/permissions/OperationsPagePermissions.test.ts", operations_test)

          def mail_contract(lines):
              insert_after(lines, '    "frontend/src/pages/BulkEmailOperationWizardPage.tsx",', ['    "frontend/src/pages/OperationsPage.tsx",'])
              insert_after(lines, '    "frontend/src/permissions/BulkEmailOperationWizardPermissions.test.ts",', ['    "frontend/src/permissions/OperationsPagePermissions.test.ts",'])
              replace_line(lines, '      { "code": "fair_crm.fair_emails.execute", "action": "access the bulk-email operation wizard", "scope": "organization", "assignable": true },', '      { "code": "fair_crm.fair_emails.execute", "action": "authorize the Bulk Email send action and wizard business flow", "scope": "organization", "assignable": true },')
              replace_line(lines, '    "route_guard": { "status": "required", "reason": "The specialized /operations/new/bulk-email route is guarded by fair_crm.fair_emails.execute; fair_crm.operations.create remains only the generic new-operation fallback and is not a Bulk Email prerequisite." },', '    "route_guard": { "status": "required", "reason": "The specialized /operations/new/bulk-email route requires fair_crm.fair_emails.execute plus the mandatory fair_crm.mail_templates.read and fair_crm.email_accounts.read lookup prerequisites; fair_crm.operations.create is not a Bulk Email prerequisite." },')
              replace_line(lines, '  "notes": "Bulk Email wizard entry uses fair_crm.fair_emails.execute and does not require fair_crm.operations.create. Mail-template read and email-account read remain separate capabilities for the mail-settings lookups. The email-account list client fails closed locally when fair_crm.email_accounts.read is absent, preventing an unauthorized /email-accounts request. Preview remains a separate fair_crm.fair_emails.preview capability and is not a prerequisite for execute-only Send. Generic operation creation routes retain fair_crm.operations.create."', '  "notes": "Bulk Email wizard entry requires fair_crm.fair_emails.execute together with fair_crm.mail_templates.read and fair_crm.email_accounts.read because template and sender selection are mandatory to complete the wizard. The Operations-page type picker uses the same composite entry prerequisite. Send itself remains authorized only by fair_crm.fair_emails.execute, preview remains the independent optional fair_crm.fair_emails.preview capability, and fair_crm.operations.create is not a Bulk Email prerequisite. The email-account list client continues to fail closed locally when fair_crm.email_accounts.read is absent."')
          edit(".kyrox/features/bulk-email-mail-settings-permission-consistency.json", mail_contract)

          def entry_contract(lines):
              insert_after(lines, '    "frontend/src/permissions/OperationsPagePermissions.test.ts",', ['    "frontend/src/permissions/navigationPermissions.ts",', '    "frontend/src/permissions/navigationPermissions.test.ts",'])
              replace_line(lines, '        "action": "open and select the Bulk Email new-operation entry",', '        "action": "authorize the Bulk Email business flow for the new-operation entry",')
              marker = one(lines, '        "action": "authorize the Bulk Email business flow for the new-operation entry",')
              close = marker + 3
              if lines[close] != '      }':
                  raise SystemExit("unexpected fair-email permission item shape")
              lines[close] = '      },'
              lines[close + 1:close + 1] = [
                  '      {',
                  '        "code": "fair_crm.mail_templates.read",',
                  '        "action": "load the mandatory mail-template selector in the Bulk Email wizard",',
                  '        "scope": "organization",',
                  '        "assignable": true',
                  '      },',
                  '      {',
                  '        "code": "fair_crm.email_accounts.read",',
                  '        "action": "load the mandatory sender-account selector in the Bulk Email wizard",',
                  '        "scope": "organization",',
                  '        "assignable": true',
                  '      }',
              ]
              replace_line(lines, '    "route_guard": { "status": "na", "reason": "The Bulk Email wizard route already uses fair_crm.fair_emails.execute; this change aligns the Operations-page entry point." },', '    "route_guard": { "status": "required", "reason": "The Bulk Email wizard route and Operations-page type picker both require fair_crm.fair_emails.execute plus the mandatory mail_templates.read and email_accounts.read lookup prerequisites." },')
              replace_line(lines, '  "notes": "A user with fair_crm.fair_emails.execute can reach the Bulk Email wizard from /operations without also needing fair_crm.operations.create. Generic operation entries continue to require fair_crm.operations.create. Enrichment and Scraper new-operation entry alignment remain intentionally outside this focused change. The type picker filters entries through the same fail-closed permission predicate used by onContinue."', '  "notes": "Bulk Email entry from /operations requires fair_crm.fair_emails.execute plus fair_crm.mail_templates.read and fair_crm.email_accounts.read because both lookups are mandatory wizard prerequisites. This entry still does not require fair_crm.operations.create, and already-created Bulk Email Start/Retry plus final Send continue to use fair_crm.fair_emails.execute without adding these read permissions to the mutation boundary. Generic operation entries retain their existing permission behavior. The type picker and deep-link route use equivalent fail-closed prerequisites."')
          edit(".kyrox/features/operations-new-bulk-email-entry-permission-consistency.json", entry_contract)

          def route_contract(lines):
              replace_line(lines, '        "action": "enter the Bulk Email immediate-send wizard",', '        "action": "authorize the Bulk Email immediate-send business flow",')
              marker = one(lines, '        "action": "authorize the Bulk Email immediate-send business flow",')
              close = marker + 3
              if lines[close] != '      },':
                  raise SystemExit("unexpected route fair-email permission item shape")
              lines[close + 1:close + 1] = [
                  '      {',
                  '        "code": "fair_crm.mail_templates.read",',
                  '        "action": "load the mandatory Bulk Email mail-template selector",',
                  '        "scope": "organization",',
                  '        "assignable": true',
                  '      },',
                  '      {',
                  '        "code": "fair_crm.email_accounts.read",',
                  '        "action": "load the mandatory Bulk Email sender-account selector",',
                  '        "scope": "organization",',
                  '        "assignable": true',
                  '      },',
              ]
              replace_line(lines, '  "notes": "Specialized operation wizard deep links must not reintroduce generic operation-create prerequisites. Bulk Email uses fair_emails.execute. Enrichment Start remains authorized by scraper.execute, while entering its wizard additionally requires scraper.read because the form must load the user-visible enrichment manifest/output-field capabilities; its fair filter remains optional and is independently shown only with fairs.read. Scraper Start remains authorized by scraper.execute, while entering its wizard additionally requires fairs.read and scraper.read because the user must deliberately discover/select a fair and adapter/manifest. Duplicate Check uses operations.execute plus its legitimate data_operations.read page prerequisite. Unsupported or legacy /operations/new fallbacks resolve to the Operations list and therefore require operations.read; the Operations-page New entry point remains separately gated by operations.create."', '  "notes": "Specialized operation wizard deep links must not reintroduce generic operation-create prerequisites. Bulk Email Send remains authorized by fair_emails.execute, while entering its wizard additionally requires mail_templates.read and email_accounts.read because both selectors are mandatory to complete the form. Enrichment Start remains authorized by scraper.execute, while entering its wizard additionally requires scraper.read because the form must load the user-visible enrichment manifest/output-field capabilities; its fair filter remains optional and is independently shown only with fairs.read. Scraper Start remains authorized by scraper.execute, while entering its wizard additionally requires fairs.read and scraper.read because the user must deliberately discover/select a fair and adapter/manifest. Duplicate Check uses operations.execute plus its legitimate data_operations.read page prerequisite. Unsupported or legacy /operations/new fallbacks resolve to the Operations list and therefore require operations.read; the Operations-page New entry point remains separately gated by operations.create."')
          edit(".kyrox/features/operation-wizard-route-permission-consistency.json", route_contract)

          for temp in [
              Path(".github/workflows/tmp-bulk-email-mail-settings-prerequisites.yml"),
              Path(".github/workflows/tmp-fix-bulk-email-prerequisite-workflow.yml"),
          ]:
              if temp.exists():
                  temp.unlink()
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git diff --cached --stat
          git commit -m "fix(auth): align bulk email wizard prerequisites"
          git push origin "HEAD:${GITHUB_REF_NAME}"
