name: One-shot bulk email retry permission patch

on:
  push:
    branches:
      - fix/bulk-email-retry-single-permission

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/bulk-email-retry-single-permission
          fetch-depth: 0

      - name: Apply focused permission patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_preserving_eol(path: str, old: str, new: str, *, expected: int = 1) -> None:
              p = Path(path)
              data = p.read_bytes()
              newline = b"\r\n" if b"\r\n" in data else b"\n"
              old_b = old.replace("\n", "\r\n" if newline == b"\r\n" else "\n").encode("utf-8")
              new_b = new.replace("\n", "\r\n" if newline == b"\r\n" else "\n").encode("utf-8")
              count = data.count(old_b)
              if count != expected:
                  raise SystemExit(f"{path}: expected {expected} matches, found {count}")
              p.write_bytes(data.replace(old_b, new_b, expected))

          def write_with_eol(path: str, content: str, newline: bytes = b"\n") -> None:
              rendered = content.replace("\n", "\r\n" if newline == b"\r\n" else "\n")
              Path(path).write_bytes(rendered.encode("utf-8"))

          retry_path = "backend/app/modules/operations/application/retry_operation.py"
          replace_preserving_eol(
              retry_path,
              "from app.modules.operations.domain.value_objects import OperationStatus, RunStatus\n",
              "from app.modules.operations.domain.value_objects import OperationStatus, OperationType, RunStatus\n",
          )
          replace_preserving_eol(
              retry_path,
              'PERMISSION_EXECUTE = "fair_crm.operations.execute"\n',
              'PERMISSION_EXECUTE = "fair_crm.operations.execute"\nPERMISSION_BULK_EMAIL_EXECUTE = "fair_crm.fair_emails.execute"\n',
          )
          replace_preserving_eol(
              retry_path,
              '''    def execute(self, command: RetryOperationCommand) -> OperationResult:\n        if not self._authorization.check_permission(\n            organization_id=command.organization_id,\n            user_id=command.user_id,\n            permission_code=PERMISSION_EXECUTE,\n            access_token=command.access_token,\n        ):\n            raise ForbiddenError("Permission denied")\n\n        operation = self._operation_repository.get_by_id(\n            command.organization_id, command.operation_id\n        )\n        if operation is None:\n            raise OperationNotFoundError("Operation not found")\n''',
              '''    def execute(self, command: RetryOperationCommand) -> OperationResult:\n        operation = self._operation_repository.get_by_id(\n            command.organization_id, command.operation_id\n        )\n        if operation is None:\n            raise OperationNotFoundError("Operation not found")\n\n        permission_code = (\n            PERMISSION_BULK_EMAIL_EXECUTE\n            if operation.operation_type == OperationType.BULK_EMAIL\n            else PERMISSION_EXECUTE\n        )\n        if not self._authorization.check_permission(\n            organization_id=command.organization_id,\n            user_id=command.user_id,\n            permission_code=permission_code,\n            access_token=command.access_token,\n        ):\n            raise ForbiddenError("Permission denied")\n''',
          )

          detail_path = "frontend/src/pages/OperationDetailPageLegacy.tsx"
          replace_preserving_eol(
              detail_path,
              'import { OPERATION_EXECUTE } from "../permissions/operationPermissions";\n',
              'import { FAIR_EMAIL_PERMISSION_EXECUTE } from "../permissions/fairEmailPermissions";\nimport { OPERATION_EXECUTE } from "../permissions/operationPermissions";\n',
          )
          replace_preserving_eol(
              detail_path,
              "  const canExecute = can(OPERATION_EXECUTE);\n",
              "  const canExecute = can(OPERATION_EXECUTE);\n  const canRetryBulkEmail = can(FAIR_EMAIL_PERMISSION_EXECUTE);\n",
          )
          replace_preserving_eol(
              detail_path,
              "  const handleRetryFailed = async () => {\n    if (!canExecute) return;\n",
              "  const handleRetryFailed = async () => {\n    if (!canRetryBulkEmail) return;\n",
          )
          replace_preserving_eol(
              detail_path,
              "  const canRetryFailed =\n    canExecute &&\n    isBulkEmail &&\n",
              "  const canRetryFailed =\n    canRetryBulkEmail &&\n    isBulkEmail &&\n",
          )
          replace_preserving_eol(
              detail_path,
              "      {retryConfirmOpen && canExecute ? (\n",
              "      {retryConfirmOpen && canRetryBulkEmail ? (\n",
          )

          test_path = "frontend/src/permissions/OperationDetailExecutePermissions.test.ts"
          original_test = Path(test_path).read_bytes()
          test_eol = b"\r\n" if b"\r\n" in original_test else b"\n"
          write_with_eol(
              test_path,
              '''import { readFileSync } from "node:fs";\nimport { describe, expect, it } from "vitest";\n\nconst source = readFileSync(\n  new URL("../pages/OperationDetailPageLegacy.tsx", import.meta.url),\n  "utf8",\n);\n\ndescribe("OperationDetailPage execute permissions", () => {\n  it("keeps generic operation execute at start and cancel mutation boundaries", () => {\n    expect(source.match(/if \\(!canExecute\\) return;/g)).toHaveLength(2);\n    expect(source).toContain("await startOperation(operationId);");\n    expect(source).toContain("await cancelOperation(operationId);");\n    expect(source).toContain("const canStart =\\n    canExecute &&");\n    expect(source).toContain("const canCancel =\\n    canExecute &&");\n  });\n\n  it("uses fair email execute at every bulk email retry boundary", () => {\n    expect(source).toContain(\n      'import { FAIR_EMAIL_PERMISSION_EXECUTE } from "../permissions/fairEmailPermissions";',\n    );\n    expect(source).toContain("const canRetryBulkEmail = can(FAIR_EMAIL_PERMISSION_EXECUTE);");\n    expect(source).toContain(\n      "const handleRetryFailed = async () => {\\n    if (!canRetryBulkEmail) return;",\n    );\n    expect(source).toContain("const canRetryFailed =\\n    canRetryBulkEmail &&");\n    expect(source).toContain("retryConfirmOpen && canRetryBulkEmail");\n    expect(source).toContain("await retryBulkEmailOperationFailed(operationId);");\n  });\n});\n''',
              test_eol,
          )

          backend_test = '''from pathlib import Path\n\n\nRETRY_OPERATION = Path("app/modules/operations/application/retry_operation.py")\n\n\ndef test_bulk_email_retry_uses_fair_email_execute_but_other_retries_keep_operations_execute():\n    source = RETRY_OPERATION.read_text(encoding="utf-8")\n\n    assert 'PERMISSION_EXECUTE = "fair_crm.operations.execute"' in source\n    assert 'PERMISSION_BULK_EMAIL_EXECUTE = "fair_crm.fair_emails.execute"' in source\n    assert "if operation.operation_type == OperationType.BULK_EMAIL" in source\n    assert "else PERMISSION_EXECUTE" in source\n    assert "permission_code=permission_code" in source\n\n\ndef test_retry_loads_operation_before_selecting_business_permission():\n    source = RETRY_OPERATION.read_text(encoding="utf-8")\n\n    load_index = source.index("operation = self._operation_repository.get_by_id(")\n    permission_index = source.index("permission_code = (")\n    check_index = source.index("if not self._authorization.check_permission(")\n    assert load_index < permission_index < check_index\n'''
          Path("backend/tests/modules/operations/test_bulk_email_retry_permission_consistency.py").write_text(
              backend_test, encoding="utf-8", newline="\n"
          )

          contract = '''{\n  "version": 1,\n  "id": "bulk-email-retry-permission-consistency",\n  "title": "Bulk Email Retry Permission Consistency",\n  "feature_type": "user_triggered_operation",\n  "owner": "fair-crm",\n  "platform_reusability": "existing_core_capability",\n  "trigger": "user",\n  "tenant_scope": "organization",\n  "user_facing": true,\n  "affected_paths": [\n    "backend/app/modules/operations/application/retry_operation.py",\n    "backend/tests/modules/operations/test_bulk_email_retry_permission_consistency.py",\n    "frontend/src/pages/OperationDetailPageLegacy.tsx",\n    "frontend/src/permissions/OperationDetailExecutePermissions.test.ts",\n    ".kyrox/features/bulk-email-retry-permission-consistency.json"\n  ],\n  "permissions": {\n    "required": true,\n    "items": [\n      {\n        "code": "fair_crm.fair_emails.execute",\n        "action": "retry failed bulk email recipients",\n        "scope": "organization",\n        "assignable": true\n      }\n    ]\n  },\n  "frontend": {\n    "required": true,\n    "routes": ["/operations/:operationId"],\n    "menu": false,\n    "menu_permission": null\n  },\n  "applicability": {\n    "database": { "status": "na", "reason": "No persistence model changes are introduced." },\n    "migration": { "status": "na", "reason": "The existing fair_crm.fair_emails.execute permission is reused." },\n    "permissions": { "status": "required" },\n    "backend": { "status": "required" },\n    "api": { "status": "required" },\n    "tenant_isolation": { "status": "required" },\n    "audit": { "status": "na", "reason": "Existing operation retry audit events are preserved." },\n    "frontend": { "status": "required" },\n    "ui_permissions": { "status": "required" },\n    "menu": { "status": "na", "reason": "Operations navigation remains unchanged." },\n    "route_guard": { "status": "na", "reason": "The operation detail route remains governed by its existing read access; this change protects the retry action boundary." },\n    "forms": { "status": "na", "reason": "No form behavior changes." },\n    "visual_qa": { "status": "required" },\n    "backend_tests": { "status": "required" },\n    "frontend_tests": { "status": "required" },\n    "runtime_authorization": { "status": "required" },\n    "runtime_verification": { "status": "required" },\n    "deployment": { "status": "required" }\n  },\n  "notes": "Retrying failed Bulk Email recipients is the same user-triggered email execution capability as the initial Send action and therefore requires only fair_crm.fair_emails.execute. RetryOperationUseCase continues to require fair_crm.operations.execute for all other operation types. Enrichment and Scraper retry authorization are intentionally outside this focused change."\n}\n'''
          Path(".kyrox/features/bulk-email-retry-permission-consistency.json").write_text(
              contract, encoding="utf-8", newline="\n"
          )
          PY

      - name: Commit focused patch and remove workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            backend/app/modules/operations/application/retry_operation.py \
            backend/tests/modules/operations/test_bulk_email_retry_permission_consistency.py \
            frontend/src/pages/OperationDetailPageLegacy.tsx \
            frontend/src/permissions/OperationDetailExecutePermissions.test.ts \
            .kyrox/features/bulk-email-retry-permission-consistency.json
          git rm .github/workflows/one-shot-bulk-email-retry-permission.yml
          git diff --cached --check
          git commit -m "fix(auth): make bulk email retry single-permission"
          git push origin HEAD:fix/bulk-email-retry-single-permission
