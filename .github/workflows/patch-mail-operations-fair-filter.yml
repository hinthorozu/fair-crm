name: Apply Mail Operations Fair Filter Permission Patch

on:
  push:
    branches:
      - fix/mail-operations-fair-filter-permission

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/mail-operations-fair-filter-permission
          fetch-depth: 0

      - name: Patch Mail Operations fair filter permission
        shell: python
        run: |
          from pathlib import Path

          path = Path('frontend/src/pages/MailOperationsPage.tsx')
          data = path.read_bytes()
          replacements = [
              (
                  b'import {\n  canPerformEmailAccountAction,\n  canSendMail,\n  getGrantedPermissions,\n} from "../permissions/emailAccountPermissions";\n',
                  b'import {\n  canPerformEmailAccountAction,\n  canSendMail,\n  getGrantedPermissions,\n} from "../permissions/emailAccountPermissions";\nimport { FAIR_READ } from "../permissions/fairPermissions";\n',
              ),
              (
                  b'  const canReadEmailAccounts = canPerformEmailAccountAction(grantedPermissions, "read");\n',
                  b'  const canReadEmailAccounts = canPerformEmailAccountAction(grantedPermissions, "read");\n  const canReadFairs = grantedPermissions.has(FAIR_READ);\n',
              ),
              (
                  b'''        <FormField\n          label={adminLabels.mailOperationsFilterFair}\n          htmlFor="mail-operations-fair"\n        >\n          <FairEntitySelect\n            id="mail-operations-fair"\n            value={fair === "all" ? "" : fair}\n            onChange={(fairId) => setFair(fairId || "all")}\n            allowClear\n            placeholder={adminLabels.mailOperationsFilterAll}\n            clearOptionLabel={adminLabels.mailOperationsFilterAll}\n          />\n        </FormField>\n''',
                  b'''        {canReadFairs ? (\n          <FormField\n            label={adminLabels.mailOperationsFilterFair}\n            htmlFor="mail-operations-fair"\n          >\n            <FairEntitySelect\n              id="mail-operations-fair"\n              value={fair === "all" ? "" : fair}\n              onChange={(fairId) => setFair(fairId || "all")}\n              allowClear\n              placeholder={adminLabels.mailOperationsFilterAll}\n              clearOptionLabel={adminLabels.mailOperationsFilterAll}\n            />\n          </FormField>\n        ) : null}\n''',
              ),
          ]
          for old, new in replacements:
              count = data.count(old)
              if count != 1:
                  raise SystemExit(f'expected exactly one match, got {count}: {old!r}')
              data = data.replace(old, new, 1)
          path.write_bytes(data)

      - name: Commit Mail Operations page patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/pages/MailOperationsPage.tsx
          git status --short
          git commit --no-verify -m "fix(auth): hide Mail Operations fair filter without fairs read"
          git push origin HEAD:fix/mail-operations-fair-filter-permission
