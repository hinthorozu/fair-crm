name: One-shot operation detail scraper start patch

on:
  push:
    branches:
      - fix/operation-detail-scraper-start-permission

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/operation-detail-scraper-start-permission
          fetch-depth: 0

      - name: Apply focused patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_preserving_eol(path: str, old: str, new: str, expected: int = 1) -> None:
              p = Path(path)
              data = p.read_bytes()
              newline = b"\r\n" if b"\r\n" in data else b"\n"
              sep = "\r\n" if newline == b"\r\n" else "\n"
              old_b = old.replace("\n", sep).encode("utf-8")
              new_b = new.replace("\n", sep).encode("utf-8")
              count = data.count(old_b)
              if count != expected:
                  raise SystemExit(f"{path}: expected {expected} matches, found {count}")
              p.write_bytes(data.replace(old_b, new_b, expected))

          page = "frontend/src/pages/OperationDetailPageLegacy.tsx"
          replace_preserving_eol(
              page,
              "  const canStartEnrichment = can(SCRAPER_PERMISSION_EXECUTE);\n  const canRetryBulkEmail = can(FAIR_EMAIL_PERMISSION_EXECUTE);\n",
              "  const canStartEnrichment = can(SCRAPER_PERMISSION_EXECUTE);\n  const canStartScraper = can(SCRAPER_PERMISSION_EXECUTE);\n  const canRetryBulkEmail = can(FAIR_EMAIL_PERMISSION_EXECUTE);\n",
          )
          replace_preserving_eol(
              page,
              '''  const isBulkEmailOp = detail?.operation.operation_type === "bulk_email";\n  const isEnrichmentOp = detail?.operation.operation_type === "enrichment";\n  const canStartOperation = isBulkEmailOp\n    ? canStartBulkEmail\n    : isEnrichmentOp\n      ? canStartEnrichment\n      : canExecute;\n''',
              '''  const isBulkEmailOp = detail?.operation.operation_type === "bulk_email";\n  const isEnrichmentOp = detail?.operation.operation_type === "enrichment";\n  const isScraperOp = detail?.operation.operation_type === "scraper";\n  const canStartOperation = isBulkEmailOp\n    ? canStartBulkEmail\n    : isEnrichmentOp\n      ? canStartEnrichment\n      : isScraperOp\n        ? canStartScraper\n        : canExecute;\n''',
          )

          test = "frontend/src/permissions/OperationDetailExecutePermissions.test.ts"
          replace_preserving_eol(
              test,
              '''    expect(source).toContain(": isEnrichmentOp");\n    expect(source).toContain(": canExecute;");\n''',
              '''    expect(source).toContain(": isEnrichmentOp");\n    expect(source).toContain(": isScraperOp");\n    expect(source).toContain(": canExecute;");\n''',
          )
          replace_preserving_eol(
              test,
              '''  it("keeps operation execute at the Cancel mutation boundary", () => {\n''',
              '''  it("uses scraper execute for Scraper Start", () => {\n    expect(source).toContain("const canStartScraper = can(SCRAPER_PERMISSION_EXECUTE);");\n    expect(source).toContain(\n      'const isScraperOp = detail?.operation.operation_type === "scraper";',\n    );\n    expect(source).toContain("? canStartScraper");\n  });\n\n  it("keeps operation execute at the Cancel mutation boundary", () => {\n''',
          )

          contract = ".kyrox/features/operation-detail-execute-permission-consistency.json"
          replace_preserving_eol(
              contract,
              '        "action": "start an Enrichment operation from Operation Detail",\n',
              '        "action": "start an Enrichment or Scraper operation from Operation Detail",\n',
          )
          replace_preserving_eol(
              contract,
              '  "notes": "Operation Detail remains readable with its existing read access. Bulk Email Start and Retry Failed use fair_crm.fair_emails.execute. Enrichment Start uses fair_crm.scraper.execute. Generic and Scraper Start plus Cancel continue to use fair_crm.operations.execute. Scraper Detail Start alignment is intentionally outside this focused change. Bulk Email export remains read-only under the existing backend export permission."\n',
              '  "notes": "Operation Detail remains readable with its existing read access. Bulk Email Start and Retry Failed use fair_crm.fair_emails.execute. Enrichment and Scraper Start use fair_crm.scraper.execute. Generic Start and Cancel continue to use fair_crm.operations.execute. Bulk Email export remains read-only under the existing backend export permission."\n',
          )
          PY

      - name: Commit focused patch and remove workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            frontend/src/pages/OperationDetailPageLegacy.tsx \
            frontend/src/permissions/OperationDetailExecutePermissions.test.ts \
            .kyrox/features/operation-detail-execute-permission-consistency.json
          git rm .github/workflows/tmp-operation-detail-scraper-start.yml
          git diff --cached --check
          git commit -m "fix(auth): align scraper detail start permission"
          git push origin HEAD:fix/operation-detail-scraper-start-permission
