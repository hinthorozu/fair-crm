name: One-shot bulk email new operation entry patch
on:
  push:
    branches:
      - fix/operations-new-bulk-email-entry-permission
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/operations-new-bulk-email-entry-permission
          fetch-depth: 0
      - name: Apply focused patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path_str, old_text, new_text):
              path = Path(path_str)
              data = path.read_bytes()
              eol = b'\r\n' if b'\r\n' in data else b'\n'
              old = old_text.replace('\n', eol.decode()).encode()
              new = new_text.replace('\n', eol.decode()).encode()
              count = data.count(old)
              if count != 1:
                  raise SystemExit(f'{path_str}: expected 1 match, found {count}')
              path.write_bytes(data.replace(old, new, 1))

          replace_once(
              'frontend/src/pages/OperationsPage.tsx',
              '''  const canCreate = can(PERMISSION_OPERATIONS_CREATE);\n  const canExecute = can(OPERATION_EXECUTE);\n  const canStartBulkEmail = can(FAIR_EMAIL_PERMISSION_EXECUTE);\n  const canStartScraperActions = can(SCRAPER_PERMISSION_EXECUTE);''',
              '''  const canCreate = can(PERMISSION_OPERATIONS_CREATE);\n  const canExecute = can(OPERATION_EXECUTE);\n  const canStartBulkEmail = can(FAIR_EMAIL_PERMISSION_EXECUTE);\n  const canStartScraperActions = can(SCRAPER_PERMISSION_EXECUTE);\n  const canOpenNewOperation = canCreate || canStartBulkEmail;''',
          )

          replace_once(
              'frontend/src/pages/OperationsPage.tsx',
              '''  const canStartOperation = React.useCallback(\n    (operation: Operation) => {''',
              '''  const canSelectNewOperationType = React.useCallback(\n    (type: OperationType) => (type === "bulk_email" ? canStartBulkEmail : canCreate),\n    [canCreate, canStartBulkEmail],\n  );\n\n  const canStartOperation = React.useCallback(\n    (operation: Operation) => {''',
          )

          replace_once(
              'frontend/src/pages/OperationsPage.tsx',
              '''        actions={\n          canCreate ? (\n            <Button type="button" variant="primary" onClick={() => setTypeModalOpen(true)}>''',
              '''        actions={\n          canOpenNewOperation ? (\n            <Button type="button" variant="primary" onClick={() => setTypeModalOpen(true)}>''',
          )

          replace_once(
              'frontend/src/pages/OperationsPage.tsx',
              '''      <NewOperationTypeModal\n        open={canCreate && typeModalOpen}\n        onClose={() => setTypeModalOpen(false)}\n        onContinue={(type) => {\n          if (!canCreate) return;''',
              '''      <NewOperationTypeModal\n        open={canOpenNewOperation && typeModalOpen}\n        onClose={() => setTypeModalOpen(false)}\n        isTypeAllowed={canSelectNewOperationType}\n        onContinue={(type) => {\n          if (!canSelectNewOperationType(type)) return;''',
          )

          replace_once(
              'frontend/src/components/operations/NewOperationTypeModal.tsx',
              '''export interface NewOperationTypeModalProps {\n  open: boolean;\n  onClose: () => void;\n  onContinue: (type: OperationType) => void;\n}''',
              '''export interface NewOperationTypeModalProps {\n  open: boolean;\n  onClose: () => void;\n  onContinue: (type: OperationType) => void;\n  isTypeAllowed?: (type: OperationType) => boolean;\n}''',
          )

          replace_once(
              'frontend/src/components/operations/NewOperationTypeModal.tsx',
              '''function NewOperationTypeModalInner({\n  onClose,\n  onContinue,\n}: NewOperationTypeModalProps) {''',
              '''function NewOperationTypeModalInner({\n  onClose,\n  onContinue,\n  isTypeAllowed,\n}: NewOperationTypeModalProps) {''',
          )

          replace_once(
              'frontend/src/components/operations/NewOperationTypeModal.tsx',
              '''  const types = React.useMemo(\n    () => sortWizardTypes(metadata?.types ?? [], catalog),\n    [metadata?.types, catalog],\n  );''',
              '''  const types = React.useMemo(\n    () =>\n      sortWizardTypes(metadata?.types ?? [], catalog).filter(\n        (item) => !isTypeAllowed || isTypeAllowed(item.type),\n      ),\n    [metadata?.types, catalog, isTypeAllowed],\n  );''',
          )

          replace_once(
              'frontend/src/permissions/OperationsPagePermissions.test.ts',
              '''const source = readFileSync(\n  fileURLToPath(new URL("../pages/OperationsPage.tsx", import.meta.url)),\n  "utf8",\n);''',
              '''const source = readFileSync(\n  fileURLToPath(new URL("../pages/OperationsPage.tsx", import.meta.url)),\n  "utf8",\n);\n\nconst modalSource = readFileSync(\n  fileURLToPath(new URL("../components/operations/NewOperationTypeModal.tsx", import.meta.url)),\n  "utf8",\n);''',
          )

          replace_once(
              'frontend/src/permissions/OperationsPagePermissions.test.ts',
              '''  it("hides and fails closed the new operation entry point without create permission", () => {\n    expect(source).toContain("const canCreate = can(PERMISSION_OPERATIONS_CREATE)");\n    expect(source).toContain("canCreate ? (");\n    expect(source).toContain("open={canCreate && typeModalOpen}");\n    expect(source).toContain("if (!canCreate) return;");\n  });''',
              '''  it("allows Bulk Email execute to open and select its new-operation entry", () => {\n    expect(source).toContain("const canCreate = can(PERMISSION_OPERATIONS_CREATE)");\n    expect(source).toContain("const canOpenNewOperation = canCreate || canStartBulkEmail;");\n    expect(source).toContain(\n      '(type: OperationType) => (type === "bulk_email" ? canStartBulkEmail : canCreate)',\n    );\n    expect(source).toContain("canOpenNewOperation ? (");\n    expect(source).toContain("open={canOpenNewOperation && typeModalOpen}");\n    expect(source).toContain("isTypeAllowed={canSelectNewOperationType}");\n    expect(source).toContain("if (!canSelectNewOperationType(type)) return;");\n    expect(modalSource).toContain("isTypeAllowed?: (type: OperationType) => boolean;");\n    expect(modalSource).toContain("!isTypeAllowed || isTypeAllowed(item.type)");\n  });''',
          )

          contract = '''{
            "version": 1,
            "id": "operations-new-bulk-email-entry-permission-consistency",
            "title": "Operations New Bulk Email Entry Permission Consistency",
            "feature_type": "ui_only",
            "owner": "fair-crm",
            "platform_reusability": "existing_core_capability",
            "trigger": "user",
            "tenant_scope": "organization",
            "user_facing": true,
            "affected_paths": [
              "frontend/src/pages/OperationsPage.tsx",
              "frontend/src/components/operations/NewOperationTypeModal.tsx",
              "frontend/src/permissions/OperationsPagePermissions.test.ts",
              ".kyrox/features/operations-new-bulk-email-entry-permission-consistency.json"
            ],
            "permissions": {
              "required": true,
              "items": [
                {
                  "code": "fair_crm.operations.create",
                  "action": "open and select generic operation creation entries",
                  "scope": "organization",
                  "assignable": true
                },
                {
                  "code": "fair_crm.fair_emails.execute",
                  "action": "open and select the Bulk Email new-operation entry",
                  "scope": "organization",
                  "assignable": true
                }
              ]
            },
            "frontend": {
              "required": true,
              "routes": ["/operations", "/operations/new/bulk-email"],
              "menu": false,
              "menu_permission": null
            },
            "applicability": {
              "database": { "status": "na", "reason": "No persistence changes are introduced." },
              "migration": { "status": "na", "reason": "Existing permissions are reused." },
              "permissions": { "status": "required" },
              "backend": { "status": "na", "reason": "Bulk Email immediate create/start authorization already uses fair_crm.fair_emails.execute." },
              "api": { "status": "na", "reason": "No API contract changes; wizard metadata and operation-type reads already use existing read access." },
              "tenant_isolation": { "status": "na", "reason": "No organization-scoping behavior changes." },
              "audit": { "status": "na", "reason": "No audit behavior changes." },
              "frontend": { "status": "required" },
              "ui_permissions": { "status": "required" },
              "menu": { "status": "na", "reason": "No navigation menu changes are introduced." },
              "route_guard": { "status": "na", "reason": "The Bulk Email wizard route already uses fair_crm.fair_emails.execute; this change aligns the Operations-page entry point." },
              "forms": { "status": "na", "reason": "No business form behavior changes; the type picker only filters unauthorized operation types." },
              "visual_qa": { "status": "required" },
              "backend_tests": { "status": "na", "reason": "Backend authorization behavior is unchanged." },
              "frontend_tests": { "status": "required" },
              "runtime_authorization": { "status": "required" },
              "runtime_verification": { "status": "required" },
              "deployment": { "status": "required" }
            },
            "notes": "A user with fair_crm.fair_emails.execute can reach the Bulk Email wizard from /operations without also needing fair_crm.operations.create. Generic operation entries continue to require fair_crm.operations.create. Enrichment and Scraper new-operation entry alignment remain intentionally outside this focused change. The type picker filters entries through the same fail-closed permission predicate used by onContinue."
          }
          '''
          Path('.kyrox/features/operations-new-bulk-email-entry-permission-consistency.json').write_text(contract, encoding='utf-8')
          PY
      - name: Commit focused patch and remove workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/tmp-operations-new-bulk-email-entry.yml
          git add frontend/src/pages/OperationsPage.tsx frontend/src/components/operations/NewOperationTypeModal.tsx frontend/src/permissions/OperationsPagePermissions.test.ts .kyrox/features/operations-new-bulk-email-entry-permission-consistency.json
          git commit -m "fix(auth): align bulk email new operation entry permission"
          git push origin HEAD:fix/operations-new-bulk-email-entry-permission
