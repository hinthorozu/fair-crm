name: Temporary Duplicate Check Run Permission Patch

on:
  push:
    branches:
      - fix/duplicate-check-run-single-permission

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/duplicate-check-run-single-permission
          fetch-depth: 0

      - name: Apply narrow permission patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              raw = p.read_bytes()
              old_b = old.encode("utf-8")
              new_b = new.encode("utf-8")
              count = raw.count(old_b)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one match, found {count}: {old!r}")
              p.write_bytes(raw.replace(old_b, new_b, 1))

          page = "frontend/src/pages/DataOperationsPage.tsx"
          replace_once(
              page,
              'import { PERMISSION_OPERATIONS_CREATE } from "../permissions/navigationPermissions";\n',
              '',
          )
          replace_once(
              page,
              '  const canRun = can(PERMISSION_OPERATIONS_CREATE) && can(OPERATION_EXECUTE);',
              '  const canRun = can(OPERATION_EXECUTE);',
          )

          create = "backend/app/modules/operations/application/create_operation.py"
          replace_once(
              create,
              'PERMISSION_CREATE = "fair_crm.operations.create"\nPERMISSION_BULK_EMAIL_EXECUTE = "fair_crm.fair_emails.execute"',
              'PERMISSION_CREATE = "fair_crm.operations.create"\nPERMISSION_EXECUTE = "fair_crm.operations.execute"\nPERMISSION_BULK_EMAIL_EXECUTE = "fair_crm.fair_emails.execute"',
          )
          replace_once(
              create,
              '''        permission_code = (\n            PERMISSION_BULK_EMAIL_EXECUTE\n            if command.operation_type == "bulk_email" and command.start_immediately\n            else PERMISSION_CREATE\n        )''',
              '''        permission_code = (\n            PERMISSION_BULK_EMAIL_EXECUTE\n            if command.operation_type == "bulk_email" and command.start_immediately\n            else (\n                PERMISSION_EXECUTE\n                if command.operation_type == "duplicate_check" and command.start_immediately\n                else PERMISSION_CREATE\n            )\n        )''',
          )

          service = "backend/app/modules/system_admin/application/data_operation_service.py"
          replace_once(
              service,
              'PERMISSION_READ = "fair_crm.admin.data_operations.read"\nPERMISSION_RUN = "fair_crm.admin.data_operations.execute"',
              'PERMISSION_READ = "fair_crm.admin.data_operations.read"\nPERMISSION_RUN = "fair_crm.admin.data_operations.execute"\nPERMISSION_OPERATION_EXECUTE = "fair_crm.operations.execute"',
          )
          replace_once(
              service,
              '''        operation_key: str,\n        group_by: str | None = None,\n        fair_id: UUID | None = None,\n    ) -> DataOperationRun:\n        if not self._authorization.check_permission(''',
              '''        operation_key: str,\n        group_by: str | None = None,\n        fair_id: UUID | None = None,\n        from_operation_start: bool = False,\n    ) -> DataOperationRun:\n        permission_code = PERMISSION_OPERATION_EXECUTE if from_operation_start else PERMISSION_RUN\n        if not self._authorization.check_permission(''',
          )
          replace_once(
              service,
              '''            permission_code=PERMISSION_RUN,\n            access_token=access_token,\n        ):\n            raise ForbiddenError("Admin permission required")\n\n        definition = get_operation_definition(operation_key)''',
              '''            permission_code=permission_code,\n            access_token=access_token,\n        ):\n            raise ForbiddenError("Permission denied")\n\n        definition = get_operation_definition(operation_key)''',
          )

          handler = "backend/app/modules/operations/infrastructure/handlers/duplicate_check_handler.py"
          replace_once(
              handler,
              '        return self._start_job(operation=operation, run=run, context=context)\n\n    def on_retry(',
              '        return self._start_job(\n            operation=operation, run=run, context=context, from_operation_start=True\n        )\n\n    def on_retry(',
          )
          replace_once(
              handler,
              '''        operation: Operation,\n        run: OperationRun,\n        context: HandlerExecutionContext,\n    ) -> HandlerStartResult:\n        from app.modules.system_admin.application.data_operation_job_runner import (''',
              '''        operation: Operation,\n        run: OperationRun,\n        context: HandlerExecutionContext,\n        from_operation_start: bool = False,\n    ) -> HandlerStartResult:\n        from app.modules.system_admin.application.data_operation_job_runner import (''',
          )
          replace_once(
              handler,
              '''                operation_key=job_key,\n                group_by=group_by,\n                fair_id=fair_id,\n            )''',
              '''                operation_key=job_key,\n                group_by=group_by,\n                fair_id=fair_id,\n                from_operation_start=from_operation_start,\n            )''',
          )

          frontend_test = Path("frontend/src/permissions/DataOperationsRunPermissions.test.ts")
          frontend_test.write_text('''import { readFileSync } from "node:fs";\nimport { describe, expect, it } from "vitest";\n\nconst source = readFileSync(\n  new URL("../pages/DataOperationsPage.tsx", import.meta.url),\n  "utf8",\n);\n\ndescribe("DataOperationsPage run permissions", () => {\n  it("uses operations.execute as the single permission for runs", () => {\n    expect(source).toContain("const canRun = can(OPERATION_EXECUTE);");\n    expect(source).not.toContain("can(PERMISSION_OPERATIONS_CREATE) && can(OPERATION_EXECUTE)");\n  });\n\n  it("fails closed before creating an immediately started operation", () => {\n    expect(source).toContain("if (!canRun) return;");\n    expect(source).toContain("start_immediately: true");\n  });\n\n  it("hides the run affordance without operations.execute", () => {\n    expect(source).toContain("{canRun ? (");\n    expect(source).toContain("onClick={() => void handleRun(operation)}");\n  });\n});\n''', encoding="utf-8", newline="\n")

          backend_test = Path("backend/tests/modules/operations/test_duplicate_check_run_permission_consistency.py")
          backend_test.write_text('''from pathlib import Path\n\n\nCREATE_OPERATION = Path("app/modules/operations/application/create_operation.py")\nSTART_OPERATION = Path("app/modules/operations/application/start_operation.py")\nDUPLICATE_HANDLER = Path("app/modules/operations/infrastructure/handlers/duplicate_check_handler.py")\nDATA_OPERATION_SERVICE = Path("app/modules/system_admin/application/data_operation_service.py")\n\n\ndef test_immediate_duplicate_check_create_uses_operations_execute_permission():\n    source = CREATE_OPERATION.read_text(encoding="utf-8")\n\n    assert 'PERMISSION_CREATE = "fair_crm.operations.create"' in source\n    assert 'PERMISSION_EXECUTE = "fair_crm.operations.execute"' in source\n    assert 'if command.operation_type == "duplicate_check" and command.start_immediately' in source\n    assert "else PERMISSION_CREATE" in source\n    assert "permission_code=permission_code" in source\n\n\ndef test_duplicate_check_start_keeps_operations_execute_as_canonical_permission():\n    source = START_OPERATION.read_text(encoding="utf-8")\n\n    assert 'PERMISSION_EXECUTE = "fair_crm.operations.execute"' in source\n    assert "if operation.operation_type == OperationType.BULK_EMAIL" in source\n    assert "else PERMISSION_EXECUTE" in source\n\n\ndef test_initial_duplicate_handler_reuses_operations_execute_downstream_without_changing_retry():\n    handler_source = DUPLICATE_HANDLER.read_text(encoding="utf-8")\n    service_source = DATA_OPERATION_SERVICE.read_text(encoding="utf-8")\n\n    assert "from_operation_start=True" in handler_source\n    assert "from_operation_start: bool = False" in handler_source\n    assert "from_operation_start=from_operation_start" in handler_source\n    assert 'PERMISSION_OPERATION_EXECUTE = "fair_crm.operations.execute"' in service_source\n    assert "PERMISSION_OPERATION_EXECUTE if from_operation_start else PERMISSION_RUN" in service_source\n    assert 'PERMISSION_RUN = "fair_crm.admin.data_operations.execute"' in service_source\n''', encoding="utf-8", newline="\n")

          feature_path = Path(".kyrox/features/data-operations-run-permission-consistency.json")
          feature = json.loads(feature_path.read_text(encoding="utf-8"))
          feature["feature_type"] = "full_stack"
          feature["affected_paths"] = [
              "frontend/src/pages/DataOperationsPage.tsx",
              "frontend/src/permissions/DataOperationsRunPermissions.test.ts",
              "backend/app/modules/operations/application/create_operation.py",
              "backend/app/modules/operations/infrastructure/handlers/duplicate_check_handler.py",
              "backend/app/modules/system_admin/application/data_operation_service.py",
              "backend/tests/modules/operations/test_duplicate_check_run_permission_consistency.py",
              ".kyrox/features/data-operations-run-permission-consistency.json",
          ]
          feature["permissions"]["items"] = [{
              "code": "fair_crm.operations.execute",
              "action": "run an immediately started duplicate-check operation",
              "scope": "organization",
              "assignable": True,
          }]
          feature["applicability"]["migration"] = {"status": "na", "reason": "Existing operations.execute permission is reused."}
          feature["applicability"]["backend"] = {"status": "required"}
          feature["applicability"]["api"] = {"status": "na", "reason": "No HTTP schema changes."}
          feature["applicability"]["backend_tests"] = {"status": "required"}
          feature["notes"] = (
              "Duplicate Check Run is one user action. The frontend, immediate CreateOperation authorization, "
              "StartOperation authorization, and the initial downstream data-operation start all use "
              "fair_crm.operations.execute. The generic fair_crm.operations.create prerequisite is removed "
              "for start_immediately duplicate_check requests. Retry and route guards are intentionally out of scope."
          )
          feature_path.write_text(json.dumps(feature, ensure_ascii=False, indent=2) + "\n", encoding="utf-8", newline="\n")

          # Guard the scope explicitly.
          retry = Path("backend/app/modules/operations/application/retry_operation.py").read_text(encoding="utf-8")
          assert 'PERMISSION_EXECUTE = "fair_crm.operations.execute"' in retry
          assert "from_operation_start" not in retry
          nav = Path("frontend/src/permissions/navigationPermissions.ts").read_text(encoding="utf-8")
          assert 'pathname === "/operations/new/duplicate-check"' in nav
          PY

      - name: Remove temporary workflow and commit final diff
        shell: bash
        run: |
          rm .github/workflows/tmp-duplicate-check-run-single-permission.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(auth): make duplicate check run single-permission"
          git push origin HEAD:fix/duplicate-check-run-single-permission
