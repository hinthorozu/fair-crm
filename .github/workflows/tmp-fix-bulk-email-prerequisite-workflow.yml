name: Fix Temporary Bulk Email Patch Workflow

on:
  push:
    branches:
      - fix/bulk-email-wizard-mail-settings-prerequisites
    paths:
      - .github/workflows/tmp-fix-bulk-email-prerequisite-workflow.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove erroneous no-op and self-delete
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          target = Path('.github/workflows/tmp-bulk-email-mail-settings-prerequisites.yml')
          data = target.read_bytes()
          needle = b"              insert_after(lines, 'import {', [])\n"
          if needle not in data:
              needle = b"              insert_after(lines, 'import {', [])\r\n"
          if data.count(needle) != 1:
              raise SystemExit(f'expected one no-op line, found {data.count(needle)}')
          target.write_bytes(data.replace(needle, b'', 1))
          Path('.github/workflows/tmp-fix-bulk-email-prerequisite-workflow.yml').unlink()
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "chore: repair temporary bulk email patch workflow"
          git push origin "HEAD:${GITHUB_REF_NAME}"
