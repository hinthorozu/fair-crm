name: Temporary Enrichment Wizard Manifest Permission Patch

on:
  push:
    branches:
      - fix/enrichment-wizard-manifest-read-permission

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/enrichment-wizard-manifest-read-permission
          fetch-depth: 0

      - name: Apply exact byte-level patch
        run: |
          echo '' | base64 -d > /tmp/patch.py
          python /tmp/patch.py

      - name: Commit patch and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/permissions/navigationPermissions.ts \
                  frontend/src/permissions/navigationPermissions.test.ts \
                  frontend/src/pages/OperationsPage.tsx \
                  frontend/src/permissions/OperationsPagePermissions.test.ts \
                  .kyrox/features/operation-wizard-route-permission-consistency.json \
                  .kyrox/features/operations-new-enrichment-entry-permission-consistency.json \
                  .github/workflows/tmp-enrichment-wizard-manifest-read.yml
          git commit -m "fix(auth): align enrichment wizard manifest read"
          git push origin HEAD:fix/enrichment-wizard-manifest-read-permission
