name: Temporary Enrichment Fair Filter Permission Patch

on:
  push:
    branches:
      - fix/enrichment-fair-filter-read-permission
    paths:
      - .github/workflows/tmp-enrichment-fair-filter-read.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/enrichment-fair-filter-read-permission
          fetch-depth: 0
      - name: Apply narrow permission patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          def replace_bytes(path, old, new):
              p = Path(path)
              data = p.read_bytes()
              newline = b"\r\n" if b"\r\n" in data else b"\n"
              eol = "\r\n" if newline == b"\r\n" else "\n"
              old_b = old.replace("\n", eol).encode()
              new_b = new.replace("\n", eol).encode()
              count = data.count(old_b)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one match, got {count}")
              p.write_bytes(data.replace(old_b, new_b, 1))

          panel = "frontend/src/components/scraper/EnrichmentRunPanel.tsx"
          replace_bytes(
              panel,
              'import { usePermissions } from "../../hooks/usePermissions";\nimport { SCRAPER_PERMISSION_EXECUTE } from "../../permissions/scraperPermissions";\n',
              'import { usePermissions } from "../../hooks/usePermissions";\nimport { FAIR_READ } from "../../permissions/fairPermissions";\nimport { SCRAPER_PERMISSION_EXECUTE } from "../../permissions/scraperPermissions";\n',
          )
          replace_bytes(
              panel,
              '  const { can } = usePermissions();\n  const canExecute = can(SCRAPER_PERMISSION_EXECUTE);\n',
              '  const { can } = usePermissions();\n  const canExecute = can(SCRAPER_PERMISSION_EXECUTE);\n  const canReadFairs = can(FAIR_READ);\n',
          )
          replace_bytes(
              panel,
              '  const fairScoped = Boolean(fairId);\n  const selectedFairIds = selectedFairs.map((fair) => fair.id);\n',
              '  const fairScoped = Boolean(fairId);\n  const selectedFairIds = canReadFairs ? selectedFairs.map((fair) => fair.id) : [];\n',
          )
          replace_bytes(
              panel,
              '    canExecute,\n    companyName,\n',
              '    canExecute,\n    canReadFairs,\n    companyName,\n',
          )
          replace_bytes(
              panel,
              '      {!fairScoped ? (\n        <FairMultiSelect\n',
              '      {!fairScoped && canReadFairs ? (\n        <FairMultiSelect\n',
          )

          test = "frontend/src/permissions/EnrichmentExecutePermissions.test.ts"
          replace_bytes(
              test,
              '  it("hides and fails closed enrichment run actions without execute permission", () => {\n',
              '  it("keeps optional fair filtering behind fairs read without blocking enrichment execute", () => {\n    expect(runPanelSource).toContain(\n      \'import { FAIR_READ } from "../../permissions/fairPermissions";\',\n    );\n    expect(runPanelSource).toContain("const canReadFairs = can(FAIR_READ);");\n    expect(runPanelSource).toContain(\n      "const selectedFairIds = canReadFairs ? selectedFairs.map((fair) => fair.id) : [];",\n    );\n    expect(runPanelSource).toContain("!fairScoped && canReadFairs ? (");\n    expect(runPanelSource).toContain("if (!canExecute) return;");\n  });\n\n  it("hides and fails closed enrichment run actions without execute permission", () => {\n',
          )

          contract = {
              "version": 1,
              "id": "enrichment-fair-filter-permission-consistency",
              "title": "Enrichment Fair Filter Permission Consistency",
              "feature_type": "ui_only",
              "owner": "fair-crm",
              "platform_reusability": "existing_core_capability",
              "trigger": "user",
              "tenant_scope": "organization",
              "user_facing": True,
              "affected_paths": [
                  "frontend/src/components/scraper/EnrichmentRunPanel.tsx",
                  "frontend/src/permissions/EnrichmentExecutePermissions.test.ts",
                  ".kyrox/features/enrichment-fair-filter-permission-consistency.json",
              ],
              "permissions": {
                  "required": True,
                  "items": [
                      {
                          "code": "fair_crm.scraper.execute",
                          "action": "run enrichment without requiring optional fair discovery",
                          "scope": "organization",
                          "assignable": True,
                      },
                      {
                          "code": "fair_crm.fairs.read",
                          "action": "discover and select fairs for the optional org-wide enrichment filter",
                          "scope": "organization",
                          "assignable": True,
                      },
                  ],
              },
              "frontend": {
                  "required": True,
                  "routes": ["/operations/new/enrichment", "/data-integration/adapters/:adapterKey"],
                  "menu": False,
                  "menu_permission": None,
              },
              "applicability": {
                  "database": {"status": "na", "reason": "No persistence changes are introduced."},
                  "migration": {"status": "na", "reason": "Existing scraper execute and fair read permissions are reused."},
                  "permissions": {"status": "required"},
                  "backend": {"status": "na", "reason": "Existing enrichment execution and fair lookup authorization remain unchanged and authoritative."},
                  "api": {"status": "na", "reason": "No server API contract changes; the fair lookup client already fails closed without fair_crm.fairs.read."},
                  "tenant_isolation": {"status": "na", "reason": "No organization-scoping behavior changes."},
                  "audit": {"status": "na", "reason": "No mutation or audit behavior changes."},
                  "frontend": {"status": "required"},
                  "ui_permissions": {"status": "required"},
                  "menu": {"status": "na", "reason": "No navigation menu changes are introduced."},
                  "route_guard": {"status": "na", "reason": "Enrichment route access and execution remain governed by scraper permissions; this change only gates optional fair discovery."},
                  "forms": {"status": "required"},
                  "visual_qa": {"status": "required"},
                  "backend_tests": {"status": "na", "reason": "Backend executable behavior is unchanged."},
                  "frontend_tests": {"status": "required"},
                  "runtime_authorization": {"status": "required"},
                  "runtime_verification": {"status": "required"},
                  "deployment": {"status": "required"},
              },
              "notes": "Enrichment remains runnable with fair_crm.scraper.execute alone. On org-wide enrichment surfaces, the optional fair picker is shown only with fair_crm.fairs.read. If fair read is absent or is lost after a selection was made, selected fair ids are excluded from the outgoing enrichment request. Fair-scoped enrichment from an already-authorized fair detail is unchanged.",
          }
          Path(".kyrox/features/enrichment-fair-filter-permission-consistency.json").write_text(
              json.dumps(contract, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

          git add frontend/src/components/scraper/EnrichmentRunPanel.tsx \
                  frontend/src/permissions/EnrichmentExecutePermissions.test.ts \
                  .kyrox/features/enrichment-fair-filter-permission-consistency.json
          git config core.whitespace cr-at-eol
          git diff --cached --check
          git rm .github/workflows/tmp-enrichment-fair-filter-read.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(auth): gate enrichment fair filter"
          git push origin HEAD:fix/enrichment-fair-filter-read-permission
