name: Temporary Import Legacy Route Permission Patch

on:
  push:
    branches:
      - fix/import-legacy-route-permissions

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply exact byte-level patch
        shell: python
        run: |
          from pathlib import Path
          import json

          def replace_once(path: str, old: bytes, new: bytes) -> None:
              p = Path(path)
              data = p.read_bytes()
              if data.count(old) != 1:
                  raise SystemExit(f"expected exactly one match in {path}, found {data.count(old)}")
              p.write_bytes(data.replace(old, new, 1))

          nav = "frontend/src/permissions/navigationPermissions.ts"
          test = "frontend/src/permissions/navigationPermissions.test.ts"

          nav_bytes = Path(nav).read_bytes()
          nl = b"\r\n" if b"\r\n" in nav_bytes else b"\n"

          old = nl.join([
              b'  if (pathname === "/imports") {',
              b'    return hasGrantedCorePermission(granted, PERMISSION_IMPORTS_CREATE);',
              b'  }',
              b'  if (pathname === "/data-integration/imports/new") {',
          ])
          new = nl.join([
              b'  if (pathname === "/imports" || pathname === "/data-integration/imports/new") {',
          ])
          replace_once(nav, old, new)

          old = nl.join([
              b'  if (pathname.startsWith("/data-integration/imports/fair/")) {',
              b'    return hasGrantedCorePermission(granted, PERMISSION_IMPORTS_CREATE);',
              b'  }',
          ])
          new = nl.join([
              b'  if (',
              b'    pathname.startsWith("/data-integration/imports/fair/") ||',
              b'    pathname.startsWith("/imports/fair/")',
              b'  ) {',
              b'    return hasGrantedCorePermission(granted, PERMISSION_IMPORTS_CREATE);',
              b'  }',
          ])
          replace_once(nav, old, new)

          old = nl.join([
              b'  if (pathname === "/data-integration/imports" || pathname.startsWith("/imports/fair/")) {',
              b'    return hasGrantedCorePermission(granted, PERMISSION_IMPORTS_READ);',
              b'  }',
          ])
          new = nl.join([
              b'  if (pathname === "/data-integration/imports") {',
              b'    return hasGrantedCorePermission(granted, PERMISSION_IMPORTS_READ);',
              b'  }',
          ])
          replace_once(nav, old, new)

          test_bytes = Path(test).read_bytes()
          tnl = b"\r\n" if b"\r\n" in test_bytes else b"\n"
          old = tnl.join([
              b'    expect(canAccessApplicationPath("/imports", importCreator)).toBe(true);',
              b'    expect(resolvePermissionLandingPath("/data-integration/", importCreator)).toBeNull();',
          ])
          new = tnl.join([
              b'    expect(canAccessApplicationPath("/imports", importCreator)).toBe(false);',
              b'    expect(canAccessApplicationPath("/imports/fair/fair-1", importCreator)).toBe(true);',
              b'    expect(resolvePermissionLandingPath("/data-integration/", importCreator)).toBeNull();',
          ])
          replace_once(test, old, new)

          old = tnl.join([
              b'    expect(',
              b'      canAccessApplicationPath("/data-integration/imports/new", generalImportCreator),',
              b'    ).toBe(true);',
              b'    expect(resolvePermissionLandingPath("/data-integration/", generalImportCreator)).toBe(',
          ])
          new = tnl.join([
              b'    expect(',
              b'      canAccessApplicationPath("/data-integration/imports/new", generalImportCreator),',
              b'    ).toBe(true);',
              b'    expect(canAccessApplicationPath("/imports", generalImportCreator)).toBe(true);',
              b'    expect(resolvePermissionLandingPath("/data-integration/", generalImportCreator)).toBe(',
          ])
          replace_once(test, old, new)

          old = tnl.join([
              b'    expect(canAccessApplicationPath("/data-integration/imports/new", importReader)).toBe(false);',
              b'    expect(firstAccessibleDataIntegrationPath(importReader)).toBe("/data-integration/imports");',
          ])
          new = tnl.join([
              b'    expect(canAccessApplicationPath("/data-integration/imports/new", importReader)).toBe(false);',
              b'    expect(canAccessApplicationPath("/imports/fair/fair-1", importReader)).toBe(false);',
              b'    expect(firstAccessibleDataIntegrationPath(importReader)).toBe("/data-integration/imports");',
          ])
          replace_once(test, old, new)

          contract = {
              "version": 1,
              "id": "import-legacy-route-permission-consistency",
              "title": "Import Legacy Route Permission Consistency",
              "feature_type": "ui_only",
              "owner": "fair-crm",
              "platform_reusability": "existing_core_capability",
              "trigger": "user",
              "tenant_scope": "organization",
              "user_facing": True,
              "affected_paths": [
                  "frontend/src/permissions/navigationPermissions.ts",
                  "frontend/src/permissions/navigationPermissions.test.ts",
                  ".kyrox/features/import-legacy-route-permission-consistency.json",
              ],
              "permissions": {
                  "required": True,
                  "items": [
                      {
                          "code": "fair_crm.imports.create",
                          "action": "enter legacy new-import aliases that redirect to import creation",
                          "scope": "organization",
                          "assignable": True,
                      },
                      {
                          "code": "fair_crm.fairs.read",
                          "action": "select a fair when the legacy /imports alias redirects to the general import wizard",
                          "scope": "organization",
                          "assignable": True,
                      },
                  ],
              },
              "frontend": {
                  "required": True,
                  "routes": [
                      "/imports",
                      "/imports/fair/:fairId",
                      "/data-integration/imports/new",
                      "/data-integration/imports/fair/:fairId",
                  ],
                  "menu": False,
                  "menu_permission": None,
              },
              "applicability": {
                  "database": {"status": "na", "reason": "No persistence changes are introduced."},
                  "migration": {"status": "na", "reason": "Existing Core permission codes are reused."},
                  "permissions": {"status": "required"},
                  "backend": {"status": "na", "reason": "Backend authorization remains unchanged and authoritative."},
                  "api": {"status": "na", "reason": "No server API contracts change; only legacy frontend route guards are aligned with their canonical redirect targets."},
                  "tenant_isolation": {"status": "na", "reason": "No backend query or organization-scoping behavior changes."},
                  "audit": {"status": "na", "reason": "Navigation redirects do not create auditable business mutations."},
                  "frontend": {"status": "required"},
                  "ui_permissions": {"status": "required"},
                  "menu": {"status": "na", "reason": "No navigation menu behavior changes."},
                  "route_guard": {"status": "required"},
                  "forms": {"status": "na", "reason": "No import form behavior changes."},
                  "visual_qa": {"status": "required"},
                  "backend_tests": {"status": "na", "reason": "No backend executable behavior changes."},
                  "frontend_tests": {"status": "required"},
                  "runtime_authorization": {"status": "required"},
                  "runtime_verification": {"status": "required"},
                  "deployment": {"status": "required"},
              },
              "notes": "Legacy /imports redirects to the general new-import wizard and therefore requires fair_crm.imports.create plus fair_crm.fairs.read, matching the canonical destination. Legacy /imports/fair/:fairId already supplies a fair id and redirects to the fair-scoped creation route, so it requires fair_crm.imports.create only. Redirect targets and backend authorization are unchanged.",
          }
          Path(".kyrox/features/import-legacy-route-permission-consistency.json").write_text(
              json.dumps(contract, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
      - name: Commit patch and remove temporary workflow
        run: |
          rm .github/workflows/tmp-import-legacy-route-permissions.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(auth): align import legacy route permissions"
          git push
